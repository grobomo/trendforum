# Slack App Manifest for OpenClaw Personal Assistant
# ===================================================
# Import this at: https://api.slack.com/apps?new_app=1
# Choose "From an app manifest" → paste this YAML
#
# After creating the app:
# 1. Install to your workspace
# 2. Copy "Bot User OAuth Token" (xoxb-...) → SLACK_BOT_TOKEN
# 3. Under "Basic Information" > "App-Level Tokens", create one with
#    scope "connections:write" → SLACK_APP_TOKEN (xapp-...)
# 4. Store both in keyring:
#    secret-tool store --label='SLACK_BOT_TOKEN' service openclaw username SLACK_BOT_TOKEN
#    secret-tool store --label='SLACK_APP_TOKEN' service openclaw username SLACK_APP_TOKEN

display_information:
  name: "My Assistant"        # ← Change to your assistant's name
  description: "Personal AI assistant powered by OpenClaw"
  background_color: "#1a1a2e"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: "My Assistant"  # ← Change to your assistant's name
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - users:read
      - files:read
      - files:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
