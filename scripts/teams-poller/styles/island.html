<!--
  Style: island
  Description: Tropical vibes with palm tree background, semi-transparent text overlay
  Usage: Coconut Private chat, casual 1:1 conversations
-->
<div style="position:relative; border-radius:12px; overflow:hidden; max-width:600px; font-family:'Segoe UI',sans-serif;">
  <div style="background:linear-gradient(135deg, #0d7377 0%, #14a085 40%, #f5d061 100%); padding:16px 20px; min-height:80px;">
    <div style="background:rgba(255,255,255,0.88); border-radius:8px; padding:14px 18px; backdrop-filter:blur(4px);">
      <div style="color:#1a1a1a; font-size:14px; line-height:1.5;">
        {{CONTENT}}
      </div>
    </div>
    <div style="text-align:right; margin-top:6px; font-size:11px; color:rgba(255,255,255,0.7);">
      🌴 coconut
    </div>
  </div>
</div>
