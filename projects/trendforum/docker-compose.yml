services:
  trendforum:
    build: .
    ports:
      - "3847:3847"
    environment:
      - DATABASE_URL=file:./data/trendforum.db
      - WIFI_PASSWORD=${WIFI_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
